<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- WP-2.2: strict CSP - no external network at all (fonts are inlined below as data URIs). Inline
     style/script are the shell's own first-party chrome; model output is HTML-escaped and set via
     innerHTML (non-executing). connect-src 'none' forbids any fetch/XHR/WebSocket exfiltration. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; font-src data:; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<style>/*__DWIGHT_FONTS__*/</style>
<style>/*__DWIGHT_TOKENS__*/</style>
<style>/*__DWIGHT_COMPONENTS__*/</style>
<style>
  html,body{height:100%;overflow:hidden;user-select:none}
</style>
</head>
<body>
<!--__DWIGHT_ICONS__-->
  <div class="app">
    <div class="titlebar" id="bar">
      <button class="iconbtn navbtn" title="History" aria-label="History" onclick="dwightSend('nav:home')"><svg class="ic" aria-hidden="true"><use href="#ic-menu"/></svg></button>
      <span class="title"><span class="who">Dwight</span><span class="sep">·</span><span class="act" id="action">Dwight</span></span>
      <button class="iconbtn" id="walk-focus-title" title="Focus" aria-label="Focus" aria-pressed="false" hidden onclick="dwightSend('walk:focus')"><svg class="ic" aria-hidden="true"><use href="#ic-focus"/></svg></button>
      <button class="iconbtn" title="Show on canvas" aria-label="Show on canvas" onclick="dwightSend('goto')"><svg class="ic" aria-hidden="true"><use href="#ic-goto"/></svg></button>
      <button class="iconbtn" title="Minimise" aria-label="Minimise" onclick="dwightSend('minimise')"><svg class="ic" aria-hidden="true"><use href="#ic-minimise"/></svg></button>
    </div>
    <template id="dwmark"><!--__DWIGHT_MARK__--></template>
    <div class="doc"><div id="body" class="docbody"><div class="loader"><div class="breath"><span class="pulse"></span><span class="lbl">Thinking…</span></div></div></div></div>
    <div class="walkrow" id="walkrow">
      <span class="walkcount" id="walk-count"></span>
      <span class="spacer"></span>
      <div class="swrow"><label for="walk-focus">Focus</label><button class="sw" id="walk-focus" role="switch" aria-label="Focus" aria-checked="false" title="Focus: the full canvas, the bar and a Rhino viewport" onclick="dwightSend('walk:focus')"><i></i></button></div>
      <div class="swrow"><label for="walk-dim">Dim canvas</label><button class="sw" id="walk-dim" role="switch" aria-label="Dim canvas" aria-checked="true" title="Dim the rest of the canvas on each step" onclick="dwightSend('walk:dim:'+(this.getAttribute('aria-checked')==='true'?'off':'on'))"><i></i></button></div>
    </div>
    <div class="foot">
      <span class="walknav" id="walknav">
        <button class="iconbtn" id="walk-back" title="Back" aria-label="Back" onclick="dwightSend('walk:back')"><svg class="ic" aria-hidden="true"><use href="#ic-up"/></svg></button>
        <button class="iconbtn" id="walk-next" title="Next" aria-label="Next" onclick="dwightSend('walk:next')"><svg class="ic" aria-hidden="true"><use href="#ic-down"/></svg></button>
        <button class="iconbtn" id="walk-play" title="Play: step on by itself. Any key or click pauses it." aria-label="Play" aria-pressed="false" onclick="dwightSend('walk:play')"><svg class="ic" aria-hidden="true"><use id="walk-play-ic" href="#ic-play"/></svg></button>
        <button class="iconbtn" id="walk-ask" title="Ask" aria-label="Ask" onclick="dwightSend('walk:ask')"><svg class="ic" aria-hidden="true"><use href="#ic-chat"/></svg></button>
        <button class="iconbtn" id="walk-leave" title="Leave" aria-label="Leave" onclick="dwightSend('walk:leave')"><svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg></button>
      </span>
      <button class="iconbtn" id="lens-every" title="Every wire" aria-label="Every wire" aria-pressed="false" style="display:none" onclick="dwightSend('lens:all')"><svg class="ic" aria-hidden="true"><use href="#ic-wires"/></svg></button>
      <span class="meta" id="status"></span>
      <span class="spacer"></span>
      <button class="btn primary" id="diagthis" style="display:none" onclick="dwightDiagThis()">Diagnose this</button>
      <button class="btn walkgives" id="askbtn" onclick="dwightSend('askdwight')">Chat</button>
      <button class="btn" id="copybtn" onclick="dwightSend('copy')">Copy</button>
    </div>
  </div>
<script>
/*__DWIGHT_DROPDOWN__*/
/*__DWIGHT_LINKS__*/
/*__DWIGHT_DECK__*/
</script>
<script>
  var _GLYPHS={check:'check',cross:'close',chev:'chev',locate:'goto',ban:'ban'};
  function _ic(n,cls){ return '<svg class="ic'+(cls?' '+cls:'')+'" aria-hidden="true"><use href="#ic-'+_GLYPHS[n]+'"/></svg>'; }
  function esc(s){return (s==null?'':String(s)).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  // JS -> C# bridge (works across engines)
  function dwightSend(cmd){
    try{ if(window.chrome&&window.chrome.webview&&window.chrome.webview.postMessage){window.chrome.webview.postMessage(cmd);return;} }catch(e){}
    try{ if(window.external&&window.external.notify){window.external.notify(cmd);return;} }catch(e){}
    try{ document.title='dwight:'+cmd+':'+Date.now(); }catch(e){}
  }
  document.addEventListener('keydown',function(e){ if(e.key!=='Escape') return;
    var m=document.getElementById('imgmodal'); if(m&&m.classList.contains('on')){ m.classList.remove('on'); return; }  // ESC closes an open image first
    dwightSend('minimise'); });
  (function(){ // pinned right: no free move. Resize via the top + left + bottom edges (frameless = no OS border)
    var EDGE=7, active=null;
    function edgesAt(e){ var m=''; if(e.clientY<=EDGE)m+='t'; else if(e.clientY>=innerHeight-EDGE)m+='b'; if(e.clientX<=EDGE)m+='l'; return m; }
    function cursorFor(m){ if(m==='tl')return'nwse-resize'; if(m==='bl')return'nesw-resize'; if(m==='l')return'ew-resize'; if(m==='t'||m==='b')return'ns-resize'; return''; }
    document.addEventListener('mousemove',function(e){ if(active){ dwightSend('rmove:'+e.screenX+':'+e.screenY); return; } document.body.style.cursor=cursorFor(edgesAt(e))||''; }, true);
    document.addEventListener('mousedown',function(e){ if(e.button!==0||e.target.closest('.iconbtn'))return; var m=edgesAt(e); if(!m)return; active=m; e.preventDefault(); e.stopPropagation(); dwightSend('rdown:'+m+':'+e.screenX+':'+e.screenY); }, true);
    window.addEventListener('mouseup',function(){ if(active){ active=null; document.body.style.cursor=''; dwightSend('rup'); } }, true);
  })();
  // C# -> JS API
  function dwightSetAction(name){ document.getElementById('action').textContent=name; }
  function dwightSetBody(html){ _clearThink(); var b=document.getElementById('body'); b.innerHTML=html; document.querySelector('.doc').scrollTop=0; dwightDecorateCode(); }
  function dwightPlain(text,isError){ _clearThink(); var b=document.getElementById('body'); b.innerHTML=''; var p=document.createElement('p'); p.className='lead plain'+(isError?' err':''); p.textContent=text; b.appendChild(p); }
  var GH_TIPS=["Press F3 to open Find - Dwight's group names are searchable.","Double-click the canvas to search for a component by name.","Hold Alt while dragging a wire to disconnect it.","Right-click a slider to set its range and precision.","Use a Data Dam to pause a heavy solution while you wire.","Ctrl+Alt+click a component to find it on the canvas."];
  var _verbT=null,_tipT=null,_elapT=null;
  function _clearThink(){ if(_verbT){clearTimeout(_verbT);_verbT=null;} if(_tipT){clearInterval(_tipT);_tipT=null;} if(_elapT){clearInterval(_elapT);_elapT=null;} try{document.querySelector('.doc').classList.remove('chatmode');}catch(e){} try{var db=document.getElementById('diagthis'); if(db)db.style.display='none';}catch(e){} }
  // The status label is honest and static (set by C# to the real phase); it does NOT loop. If the wait
  // runs long, it escalates ONCE to "Almost there…". A live elapsed counter, the provider/model line, and
  // a Stop button keep the user in control of a long-running task. The Grasshopper tip rotates (clearly a tip).
  function dwightThinking(label,stages){
    _clearThink();
    var s = stages ? ('<div class="stages" id="stages">'+
        '<span class="stage active" data-i="0"><span class="n">1</span>Reading</span><span class="arr">&rarr;</span>'+
        '<span class="stage" data-i="1"><span class="n">2</span>Planning</span><span class="arr">&rarr;</span>'+
        '<span class="stage" data-i="2"><span class="n">3</span>Applying</span></div>') : '';
    document.getElementById('body').innerHTML='<div class="loader">'+
        '<div class="breath"><span class="pulse"></span><span class="lbl" id="thinklbl">'+esc(label||'Thinking…')+'</span><span class="elapsed" id="elapsed"></span></div>'+
        '<div class="runmeta" id="runmeta"></div>'+s+
        '<div class="tip"><b>Grasshopper tip</b><span id="tiptext">'+esc(GH_TIPS[0])+'</span></div>'+
        '<button class="btn stopbtn" onclick="dwightSend(\'stop\')">Stop</button></div>';
    var ti=0; _tipT=setInterval(function(){ var t=document.getElementById('tiptext'); if(!t){_clearThink();return;} ti=(ti+1)%GH_TIPS.length; t.textContent=GH_TIPS[ti]; },4200);
    var t0=Date.now(); _elapT=setInterval(function(){ var el=document.getElementById('elapsed'); if(!el)return; var n=Math.floor((Date.now()-t0)/1000); el.textContent=n>0?(' · '+n+'s'):''; },1000);
    if(!stages){ _verbT=setTimeout(function(){ var l=document.getElementById('thinklbl'); if(l) l.textContent='Almost there…'; },12000); }
  }
  function dwightRunMeta(text){ var r=document.getElementById('runmeta'); if(r) r.textContent=text||''; }
  function dwightSetStage(active){
    var nodes=document.querySelectorAll('#stages .stage'); if(!nodes.length)return;
    nodes.forEach(function(el){ var i=+el.getAttribute('data-i'); el.classList.remove('done','active');
      var n=el.querySelector('.n');
      if(i<active){el.classList.add('done'); n.innerHTML=_ic('check','sm');}
      else { n.textContent=String(i+1); if(i===active)el.classList.add('active'); } });
  }
  // WP-1: the arrangement switcher, appended below a Reorganise result. Flipping a mode posts back and the
  // action re-runs the nested layout only (no re-segment, no LLM), so switching is instant and free. Four modes
  // (RR2) with a one-line tooltip each.
  var ARR_MODES=[
    ['compact','Compact','Dense, balanced packing - the general-purpose read.'],
    ['hchain','Chain','One left-to-right row - reads like a sentence.'],
    ['vertical','Vertical','One top-to-bottom column - the vertical read.'],
    ['grid','Grid','Columns by flow stage - maximum air, the poster read.']];
  function dwightArrange(active){ try{
    var b=document.getElementById('body'); if(!b)return;
    var old=document.getElementById('arrange'); if(old)old.remove();
    var wrap=document.createElement('div'); wrap.className='arrange'; wrap.id='arrange';
    var lab=document.createElement('span'); lab.className='albl'; lab.textContent='Arrangement'; var dd=document.createElement('div'); dd.className='dd'; dd.id='arrange-dd'; wrap.appendChild(lab); wrap.appendChild(dd); b.appendChild(wrap);
    ddMake(dd,{ label:'Arrangement', value:active, options:ARR_MODES.map(function(m){ return { value:m[0], name:m[1], sentence:m[2] }; }), onPick:function(v){ dwightSend('arrange:'+v); } });
  }catch(e){} }
  // RR2 item 8: render a Reorganise/flip outcome as three lines with hierarchy - headline, the earned "verified"
  // line, then the muted Ctrl-Z line - instead of one run-on paragraph. Falls back to plain text if unsplit.
  function dwightOutcome(text){ _clearThink(); var b=document.getElementById('body'); b.innerHTML='';
    var t=(text==null?'':String(text));
    // split on the two sentence joins the apply summaries use: " ... (verified); one Ctrl-Z ..."
    var verIdx=t.indexOf('(verified)'); var head=t, verified='', hint='';
    if(verIdx>=0){ var end=t.indexOf('.',0); head=(end>0&&end<verIdx)?t.slice(0,end+1):t.slice(0,verIdx).replace(/[;\s]+$/,'');
      var rest=t.slice(head.length); var semi=rest.indexOf(';');
      if(semi>=0){ verified=rest.slice(0,semi).replace(/^[\s.]+/,''); hint=rest.slice(semi+1).replace(/^[\s]+/,''); }
      else verified=rest.replace(/^[\s.]+/,''); }
    var h='<div class="outcome"><div class="oc-head">'+esc(head.trim())+'</div>';
    if(verified) h+='<div class="oc-ok"><span class="oc-check">'+_ic('check')+'</span>'+esc(verified.trim())+'</div>';
    if(hint) h+='<div class="oc-hint">'+esc(hint.trim())+'</div>';
    h+='</div>'; b.innerHTML=h; }
  function dwightShowState(kind,title,msg,actionLabel,actionCmd,actionLabel2,actionCmd2){
    _clearThink();
    var ico = kind==='error'?'!':(kind==='notice'?'i':'·');
    var btn = actionLabel ? '<button class="btn primary st-action" onclick="dwightSend(\'action:'+actionCmd+'\')">'+esc(actionLabel)+'</button>' : '';
    // WP-3: an optional SECOND action (e.g. the Reorganise boundary opt-in's "No, just arrange") - a plain button beside the primary
    var btn2 = actionLabel2 ? '<button class="btn st-action" onclick="dwightSend(\'action:'+actionCmd2+'\')">'+esc(actionLabel2)+'</button>' : '';
    document.getElementById('body').innerHTML='<div class="state '+esc(kind)+'"><div class="ico">'+ico+'</div><div class="st-title">'+esc(title)+'</div><div class="st-msg">'+esc(msg)+'</div>'+btn+btn2+'</div>';
  }
  function _pinGlyph(arg,title,cls){ return '<button class="iconbtn sm pincorner'+cls+'" title="'+esc(title)+'" aria-label="'+esc(title)+'" onclick="event.stopPropagation();dwightSend(\'pin:'+esc(arg)+'\');this.disabled=true;this.title=\'Pinned\';this.setAttribute(\'aria-label\',\'Pinned\')"><svg class="ic" aria-hidden="true"><use href="#ic-notepin"/></svg></button>'; }
  // Brief DO: a result's one offer, on the card the result is. It stays in view, because a finished result has nothing else to do, and the token is the plugin's.
  function dwightPinOffer(token,title){ var card=document.querySelector('#body .outcome, #body .fault.root'); if(!card)return; var old=card.querySelector('.pincorner'); if(old)old.remove();
    card.classList.add('haspin'); card.insertAdjacentHTML('beforeend',_pinGlyph(token,title,' shown')); }
  function dwightSteps(json){ _clearThink(); var d; try{ d=JSON.parse(json); }catch(e){ d={steps:[]}; } var st=d.steps||[];
    var pin=function(arg){ return _pinGlyph(arg,'Pin as a note',''); };
    var h=(d.summary?'<div class="leadwrap"><p class="lead clickable" onclick="dwightSend(\'overview\')" title="Show the whole selection on the canvas">'+esc(d.summary)+'</p>'+pin('summary')+'</div>':'')+
      '<p class="hint">Click the summary for the whole selection, or a step to light its components and the data on their wires. Every wire, in the footer, or T on the canvas, shows them for the whole selection.</p><div class="steps">';
    st.forEach(function(s,i){ h+='<div class="step haspin" onclick="dwightSend(\'step:'+i+'\')"><span class="sn">'+(i+1)+'</span>'+
      '<div><div class="stxt">'+(s.text||'')+'</div><span class="cmpt">'+((s.ids&&s.ids.length)||0)+((s.ids&&s.ids.length)===1?' component':' components')+'</span></div>'+pin('step:'+i)+'</div>'; });
    h+='</div>'; document.getElementById('body').innerHTML=h; }
  // Brief DA: the step the Walk is on, from the host, which holds it. While a Walk is live the footer carries its four controls (Tharun's sketch: the same spot for every Next, while the highlight moves down the list), with the status giving way to them, and the arrows go to the host, so the keys keep working after a click.
  var _walkLive=false;
  // What goes under a card's sentence goes in the column the sentence is in, under its count. The card's last child is its corner pin, which holds nothing but its glyph (the eleventh gate, Tharun).
  function _cardBody(card){ return card.querySelector('.stxt').parentNode; }
  function _walkShown(on){ document.querySelector('.foot').classList.toggle('walking',on); document.getElementById('walkrow').classList.toggle('on',on); document.getElementById('walk-focus-title').hidden=!on; }
  // Brief DH: a finished Explain has arrived: its controls are here, no card is current, and the canvas has not moved. Next is step 1, and there is nothing yet to go back to or ask about.
  function dwightWalkArrived(n){ _walkLive=true; _walkShown(true);
    document.getElementById('walk-back').disabled=true; document.getElementById('walk-next').disabled=false; document.getElementById('walk-ask').disabled=true; document.getElementById('walk-play').disabled=n<2;
    document.getElementById('walk-count').textContent=n+(n===1?' step':' steps'); }
  function dwightWalkSwitches(focus,dim){ document.getElementById('walk-focus').setAttribute('aria-checked',focus?'true':'false'); document.getElementById('walk-dim').setAttribute('aria-checked',dim?'true':'false');
    document.getElementById('walk-focus-title').setAttribute('aria-pressed',focus?'true':'false');
    var df=document.getElementById('deck-focus'), dd=document.getElementById('deck-dim'); if(df) df.setAttribute('aria-checked',focus?'true':'false'); if(dd) dd.setAttribute('aria-checked',dim?'true':'false'); }
  function dwightStepCurrent(i,panelIsWalk,gone){ _walkLive=i>=0; var cards=document.querySelectorAll('.steps .step');
    _walkShown(_walkLive);
    document.getElementById('walk-back').disabled=i<=0; document.getElementById('walk-next').disabled=i>=cards.length-1; document.getElementById('walk-ask').disabled=i<0;
    document.getElementById('walk-play').disabled=cards.length<2;
    document.getElementById('walk-count').textContent=i>=0?(i+1)+' of '+cards.length:'';
    [].forEach.call(document.querySelectorAll('.steps .walkgone'),function(e){ e.remove(); });
    for(var k=0;k<cards.length;k++){ cards[k].classList.toggle('on',k===i); if(k!==i) continue;
      // Where the bar cannot be placed, nothing else says it.
      if(panelIsWalk&&gone){ var g=document.createElement('div'); g.className='walkgone'; g.textContent=gone; _cardBody(cards[k]).appendChild(g); }
      if(cards[k].scrollIntoView) cards[k].scrollIntoView({block:'nearest'}); } }
  document.addEventListener('keydown',function(e){ if(_deckOn||!_walkLive||e.ctrlKey||e.altKey||e.shiftKey||e.metaKey) return;
    if(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown'){ e.preventDefault(); dwightSend('walkkey:'+e.key); } });
  // Brief DD: Play is Pause while it plays, and while it plays any key or click pauses it, except on Play itself, whose own click is the answer.
  var _walkPlaying=false;
  function dwightWalkPlaying(on,can){ _walkPlaying=!!on; var p=document.getElementById('walk-play'), word=on?'Pause':'Play'; if(can===false) p.disabled=true;
    document.getElementById('walk-play-ic').setAttribute('href',on?'#ic-pause':'#ic-play'); p.setAttribute('aria-label',word); p.setAttribute('aria-pressed',on?'true':'false');
    p.title=on?'Pause: any key or click also pauses it.':'Play: step on by itself. Any key or click pauses it.'; }
  function _onWalkPlay(el){ var p=document.getElementById('walk-play'); return !!el&&(el===p||p.contains(el)); }
  document.addEventListener('mousedown',function(e){ if(_walkPlaying&&!_onWalkPlay(e.target)) dwightSend('walk:input'); });
  document.addEventListener('keydown',function(e){ if(!_walkPlaying) return;
    if(_onWalkPlay(e.target)&&(e.key===' '||e.key==='Enter')) return;
    if(!e.ctrlKey&&!e.altKey&&!e.shiftKey&&!e.metaKey&&(e.key==='ArrowLeft'||e.key==='ArrowRight'||e.key==='ArrowUp'||e.key==='ArrowDown')) return;   // the arrows are the host's keys, which pause too
    dwightSend('walk:input'); });
  // The step's line of times, under the current card, as the text the bar shows. The sentence stays first.
  function dwightWalkLine(line){ [].forEach.call(document.querySelectorAll('.steps .walktime'),function(e){ e.remove(); });
    var at=document.querySelector('.steps .step.on'); if(!line||!at)return;
    var t=document.createElement('div'); t.className='walktime'; t.textContent=line; _cardBody(at).appendChild(t); }
  // Brief DD: the selection's total and its slowest, under the summary, every word already written.
  function dwightWalkTotal(line){ var old=document.getElementById('walktotal'); if(old&&old.parentNode)old.parentNode.removeChild(old);
    var lead=document.querySelector('#body .lead'); if(!line||!lead)return;
    var p=document.createElement('p'); p.id='walktotal'; p.className='hint'; p.textContent=line; lead.parentNode.insertBefore(p,lead.nextSibling); }
  // Brief EI: a Learn run is a deck of cards, drawn over the steps it was made from (DwightDeck, shared with the Focus bar). Every word arrives written by the plugin; the
  // page holds no answer. An empty view takes the deck away and the steps show again; the Focus and Dim switches in the card's footer say what the panel's own say.
  var _deckOn=false;
  function _swOn(id){ var b=document.getElementById(id); return !!b&&b.getAttribute('aria-checked')==='true'; }
  function dwightDeck(json){ var v=null; try{ v=json?JSON.parse(json):null; }catch(e){ v=null; }
    var body=document.getElementById('body'), host=document.getElementById('deck');
    _deckOn=!!v; document.querySelector('.app').classList.toggle('deckon',_deckOn); body.classList.toggle('deckon',_deckOn);
    if(!v){ if(host&&host.parentNode) host.parentNode.removeChild(host); DwightDeck.render(document.createElement('div'),null); return; }
    if(!host){ host=document.createElement('div'); host.id='deck'; host.className='deckhost'; body.insertBefore(host,body.firstChild); }
    DwightDeck.render(host,v,{switches:true,focus:_swOn('walk-focus'),dim:_swOn('walk-dim')}); document.querySelector('.doc').scrollTop=0; }
  // Brief EI: "Walk this" leaves the way back to the deck above the steps; an empty label takes it away.
  function dwightDeckBack(label){ var old=document.getElementById('deckback'); if(old&&old.parentNode) old.parentNode.removeChild(old);
    if(!label) return; var body=document.getElementById('body'); var b=document.createElement('button'); b.id='deckback'; b.className='btn sm deckback'; b.textContent=label;
    b.onclick=function(){ dwightSend('deck:quiz'); }; body.insertBefore(b,body.firstChild); }
  document.addEventListener('keydown',function(e){ if(_deckOn&&DwightDeck.key(e)) e.preventDefault(); });
  // Brief DB: where data stops, and the cap's sentence, under the step they are about. Every word arrives written; a click selects what its line names.
  function dwightLens(json){ var d; try{ d=JSON.parse(json); }catch(e){ d={}; }
    // Brief DJ: the Lens's one control sits in the footer while a lens is live, Walk or no Walk, in the state the host says. A key is a shortcut, never the only door.
    var every=document.getElementById('lens-every'), lensLive=typeof d.everywire==='boolean'; every.style.display=lensLive?'':'none'; every.classList.toggle('pressed',d.everywire===true); every.setAttribute('aria-pressed',d.everywire===true?'true':'false');
    var old=document.getElementById('lens'); if(old&&old.parentNode)old.parentNode.removeChild(old);
    var steps=document.querySelector('.steps'); if(!steps)return;
    var lines=d.lines||[]; if(!lines.length&&!d.note)return;
    var h='';
    lines.forEach(function(l,i){ h+= l.action
      ? '<button class="lens-line" onclick="dwightSend(\'lens:'+i+'\')">'+esc(l.text)+'<span class="lens-act">'+esc(l.action)+'</span></button>'
      : '<p class="lens-more">'+esc(l.text)+'</p>'; });
    if(d.note)h+='<p class="lens-more">'+esc(d.note)+'</p>';
    var el=document.createElement('div'); el.id='lens'; el.className='lens'; el.innerHTML=h;
    var at=d.step>=0?steps.querySelectorAll('.step')[d.step]:null;
    if(at)at.parentNode.insertBefore(el,at.nextSibling); else steps.parentNode.insertBefore(el,steps);
  }
  // A collapsible fault row. Roots open by default, downstream rows collapsed; every row toggles + glows.
  function faultCard(x, isRoot){
    var cls=x.cls||'error';
    var pill = isRoot ? '<span class="rootpill">root cause</span>'
             : (x.role==='intrinsic' ? '<span class="rtag own">own error</span>' : '<span class="rtag">downstream</span>');
    var fix = x.fix ? '<div class="ffix"><b>Fix</b> '+x.fix+'</div>' : '';   // cause/fix are pre-rendered Markdown HTML
    var cause = x.cause ? '<div class="fcause">'+x.cause+'</div>' : '';
    var body = '<div class="fbody'+(isRoot?'':' collapsed')+'">'+cause+fix+'</div>';

    for(var i=0;i<list.length;i++){ (function(c){
      if(c.group && c.group!==grp){ grp=c.group; var g=_hdrEl('div','grp',c.group==='posture'?'Profile':'Models that run the chat'); g.setAttribute('role','heading'); g.setAttribute('aria-level','3'); menu.appendChild(g); }
      var b=_hdrEl('button','it'+(c.on?' on':''),c.label,c.title); b.onclick=function(){ _hdrOpen=null; dwightSend('hdr:'+which+':'+c.id); }; menu.appendChild(b);
    })(list[i]); }
    bar.appendChild(menu);
  }

  // Lane D: THE COMPOSER, multi-line. Enter sends; Shift+Enter breaks the line, as every chat surface does.
  // These replaced logic that was written INLINE, inside a string inside a string, as escaped-quote
  // attributes - the exact shape #275 shipped as a parse error that killed all five verbs. Named functions
  // with no quoted arguments mean the attributes that call them contain no quote characters to mangle, which
  // is the remedy the Stop button above already uses.
  function dwightComposerKey(e){
    // An Enter while an IME is composing COMMITS a candidate; it is not the end of the message.
    if(!e || e.key!=='Enter' || e.shiftKey || e.isComposing) return;   // Shift+Enter falls through to a newline
    e.preventDefault();                                                 // this Enter is the send, not a newline
    dwightComposerSend(); }
  // The text posted is the text the user sees in their own bubble and the text the model reads: all three
  // come from this one string (#153). It must also be the text TYPED: leading BLANK lines and trailing
  // whitespace go, and nothing else - never the first line's indent. A whole-string trim() took that indent
  // and left every later line's, so a pasted block changed its RELATIVE indentation, which in Python is the
  // program. ^\s*\n stops at the last blank line because an indent is followed by text, not a newline.
  function dwightComposerSend(){
    var el=document.getElementById('ci'); if(!el) return;
    var v=el.value.replace(/^\s*\n/, '').replace(/\s+$/, '');
    if(!v.trim() && !_held) return;   // whitespace only and no image: nothing to send
    dwightSend('chat:'+v); el.value=''; dwightComposerGrow(); }

  // Brief DX: AN IMAGE THE PERSON ATTACHES, by the paper-clip, Ctrl+V or a file dropped on the composer. The host reads it, downscales it and holds it, so all this does is carry what the
  // person did and draw what the host says. A chip stays until the host clears it, which it does only when the turn has been accepted: a refused send keeps the chip and the words.
  var _held=null, _chatImgMax=20971520;   // ChatImage.MaxFileBytes, so a huge file is refused before it is read. A test holds the two together.
  function _chatImgHtml(img){ if(!img||!img.sha) return ''; return '<div class="imgmsg" data-img="'+esc(img.sha)+'" onclick="_dwImgOpen(this)"><div class="imeta">'+esc(img.meta||'')+'</div></div>'; }
  function _dwImgOpen(el){ var i=el.querySelector('img'); if(i) _dwImgModal(i.src); }
  // One way for a reopened thread and a live message alike: each image in the thread asks once for its bytes, and the host reads them from the file the provider is sent.
  function _chatImgWant(){ var seen={}, els=document.querySelectorAll('.imgmsg[data-img]:not([data-asked])'); for(var i=0;i<els.length;i++){ var sha=els[i].getAttribute('data-img'); els[i].setAttribute('data-asked','1'); if(!seen[sha]){ seen[sha]=1; dwightSend('chatimg:want:'+sha); } } }
  function dwightChatImageBytes(sha, dataUrl, goneText){ var els=document.querySelectorAll('.imgmsg[data-img]');
    for(var i=0;i<els.length;i++){ var el=els[i]; if(el.getAttribute('data-img')!==sha) continue;
      if(dataUrl){ if(!el.querySelector('img')){ var im=document.createElement('img'); im.alt=''; im.src=dataUrl; el.insertBefore(im, el.firstChild); } }
      else { el.classList.add('gone'); el.querySelector('.imeta').textContent=goneText||''; } } }
  function dwightChatHeld(json){ try{ _held=json?JSON.parse(json):null; }catch(e){ _held=null; } _heldDraw(); }
  function _heldDraw(){ var el=document.getElementById('chatheld'); if(!el) return; el.innerHTML=''; el.classList.toggle('on',!!_held); if(!_held) return;
    var im=document.createElement('img'); im.alt=''; im.src=_held.src; im.title='Open this image'; im.onclick=function(){ _dwImgModal(_held.src); }; el.appendChild(im);
    var words=_hdrEl('div','words'); words.appendChild(_hdrEl('div','line',_held.line)); if(_held.note) words.appendChild(_hdrEl('div','note',_held.note)); el.appendChild(words);
    el.appendChild(_hdrIcon('chatheld-x','','close','Remove this image',function(){ dwightSend('chatimg:clear'); })); }
  function dwightChatAttach(){ dwightSend('chatimg:pick'); }
  function _chatImgFile(file){ if(!file) return;
    if(file.size>_chatImgMax){ dwightSend('chatimg:big'); return; }
    if(file.type!=='image/png'&&file.type!=='image/jpeg'){ dwightSend('chatimg:type'); return; }
    var r=new FileReader(); r.onload=function(){ dwightSend('chatimg:'+r.result); }; r.onerror=function(){ dwightSend('chatimg:unreadable'); }; r.readAsDataURL(file); }
  // A copy from a spreadsheet can carry a picture of its cells beside their text, and the text is what was meant there, so words on the clipboard win.
  document.addEventListener('paste',function(e){ if(!e.target||e.target.id!=='ci'||!e.clipboardData) return;
    var items=e.clipboardData.items||[], file=null, words=false;
    for(var i=0;i<items.length;i++){ if(items[i].type==='text/plain') words=true; else if(items[i].kind==='file'&&items[i].type.indexOf('image/')===0&&!file) file=items[i].getAsFile(); }
    if(!file||words) return;
    e.preventDefault(); _chatImgFile(file); });
  function _dragsFiles(e){ var t=e.dataTransfer&&e.dataTransfer.types; if(!t) return false; for(var i=0;i<t.length;i++) if(t[i]==='Files') return true; return false; }
  function _overComposer(e){ return !!(e.target&&e.target.closest&&e.target.closest('.composer,.drop')); }
  // A file dropped anywhere else in the panel does nothing, and text dragged into the box stays the browser's.
  document.addEventListener('dragover',function(e){ if(!_dragsFiles(e)) return; e.preventDefault(); var on=_overComposer(e); e.dataTransfer.dropEffect=on?'copy':'none'; dwightChatDrop(on); });
  document.addEventListener('dragleave',function(e){ if(e.relatedTarget===null) dwightChatDrop(false); });
  document.addEventListener('drop',function(e){ if(!_dragsFiles(e)) return; e.preventDefault(); dwightChatDrop(false); if(_overComposer(e)) _chatImgFile(e.dataTransfer.files[0]); });
  // Fit the box to what is in it. The CAP lives in ONE place - max-height on .composer textarea - and the
  // browser clamps to it and scrolls the rest, so there is no second copy of the number here to disagree.
  function dwightComposerGrow(){
    var el=document.getElementById('ci'); if(!el) return;
    el.style.height='auto'; el.style.height=el.scrollHeight+'px'; }

  // R2: give every code block a copy button. Called after any render that can produce one, and it skips
  // blocks it has already decorated, so calling it twice is harmless.
  function dwightDecorateCode(){
    try{
      var blocks = document.querySelectorAll('.doc pre');
      for(var i=0;i<blocks.length;i++){
        var pre = blocks[i];
        if(pre.parentNode && pre.parentNode.className === 'codewrap') continue;
        var wrap = document.createElement('div');
        wrap.className = 'codewrap';
        pre.parentNode.insertBefore(wrap, pre);
        wrap.appendChild(pre);
        var btn = document.createElement('button');
        btn.className = 'copybtn';
        btn.title = 'Copy to clipboard';
        btn.textContent = 'Copy';
        btn.onclick = function(e){ dwightCopyBlock(e.target); };
        wrap.appendChild(btn);
      }
    }catch(e){}
  }
  function dwightCopyBlock(btn){
    try{
      var wrap = btn.parentNode; if(!wrap) return;
      var pre = wrap.querySelector('pre'); if(!pre) return;
      var text = pre.innerText || pre.textContent || '';
      var done = function(){ btn.textContent = 'Copied'; setTimeout(function(){ btn.textContent = 'Copy'; }, 1400); };
      if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(done, function(){ dwightCopyFallback(text, done); }); }
      else dwightCopyFallback(text, done);
    }catch(e){}
  }
  function dwightCopyFallback(text, done){
    try{
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      done();
    }catch(e){}
  }
  // The host asks for the composer. insist: a flip the user just made. Otherwise the page was new and the composer has only now been drawn, and in that moment the user
  // may have moved: a focus they gave to something in this page stays, and with the page itself unfocused this waits a moment for the view's own focus to arrive.
  // Brief DA: words for the person to finish and send. Nothing is sent from here.
  function dwightComposerDraft(text){ var c=document.getElementById('ci'); if(!c) return; c.value=text||''; try{ dwightComposerGrow(); }catch(e){} }
  function dwightFocusComposer(insist){
    try{
      var c=document.getElementById('ci');
      if(!insist){
        var a=document.activeElement;
        if(a&&a!==document.body&&a!==document.documentElement) return;
        if(document.hasFocus&&!document.hasFocus()){
          var again=function(){ window.removeEventListener('focus',again); clearTimeout(t); dwightFocusComposer(false); };
          var t=setTimeout(function(){ window.removeEventListener('focus',again); },1000);
          window.addEventListener('focus',again);
          return;
        }
      }
      if(c&&!c.disabled) c.focus();
    }catch(e){}
  }
  function dwightChatBusy(on){
    try{
      var stop=document.getElementById('chatstop'); if(stop) stop.style.display = on ? 'grid' : 'none';
      var send=document.querySelector('.composer .send'); if(send) send.style.display = on ? 'none' : 'grid';
      var input=document.getElementById('ci');
      // Short because the composer is 340px wide now rather than 480: the old wording fitted the wide
      // chat and is cut mid-word in the linear one. The Stop button sits beside it and is red.
      if(input){ input.disabled = !!on; input.placeholder = on ? 'Dwight is working - press stop' : 'Reply, or describe what to build…'; }
    }catch(e){}
  }
  // Brief BG: a receipt row opens and closes on a click anywhere on its row or reason, or on Enter or Space when it has focus. Its folded card is
  // in the DOM either way; a click inside the opened card (a fold, a link, a selection) does not close it.
  document.addEventListener('click',function(e){
    var r=e.target&&e.target.closest?e.target.closest('.receipt'):null; if(!r) return;
    if(e.target.closest('.rc-full')) return;
    r.classList.toggle('open'); r.setAttribute('aria-expanded', r.classList.contains('open')?'true':'false');
  });
  document.addEventListener('keydown',function(e){
    if(e.key!=='Enter'&&e.key!==' ') return;
    var r=e.target&&e.target.classList&&e.target.classList.contains('receipt')?e.target:null; if(!r) return;
    e.preventDefault(); r.classList.toggle('open'); r.setAttribute('aria-expanded', r.classList.contains('open')?'true':'false');
  });
  // Brief BG: the host says a card was answered (approved, approved automatically, superseded): the message holding the card minted with
  // that token is replaced, in place, by its receipt as the host built it. Nothing is computed here.
  function dwightCardAnswered(token, html){
    if(!token) return; var th=document.getElementById('thread'); if(!th) return;
    var ms=th.querySelectorAll('.msg'); var needle="consent:"+token;
    for(var i=0;i<ms.length;i++){ var m=ms[i]; if(m.querySelector('.receipt')) continue; if(m.innerHTML.indexOf(needle)<0) continue;
      var next=m.nextElementSibling; m.insertAdjacentHTML('afterend', msgBubble('dw', html)); m.remove();
      if(next && next.getAttribute('data-echo')) next.remove(); }
  }
  // Brief BG (Tharun's ruling): the user line a click or an automatic approval appends is not rendered when a receipt with a state immediately precedes it - the
  // state already says it. The line stays in the record and in the transcript the model reads; only the screen leaves it out. U111: BY THE HOST'S MARK, NEVER BY THE
  // WORDS. A user who types "Yes, go ahead." after a receipt has said something, and it is sent and recorded, so it is drawn.
  function _isStatedReceipt(html){ return /^\s*<div class="receipt[^>]*data-state="[^"]+"/.test(html||''); }
  function _echoAfterReceipt(m, prev){ return !!m.echo && !!prev && prev.who!=='me' && _isStatedReceipt(prev.html); }
  function dwightChatAppend(who, html, echo, imgJson){ var th=document.getElementById('thread'); if(!th)return;
    var img=null; if(imgJson){ try{ img=JSON.parse(imgJson); }catch(e){} }
    var last=th.lastElementChild; if(echo && last && last.classList.contains('rc')){ var rc=last.querySelector('.receipt[data-state]'); if(rc && rc.getAttribute('data-state')) return; } th.insertAdjacentHTML('beforeend', msgBubble(who, html, echo, img)); th.scrollTop=th.scrollHeight; dwightDecorateCode(); if(img) _chatImgWant(); }
  // ---- Scaffold shell renderers (spec 3.10) - DORMANT: nothing calls these yet; the Phase-8 build
  // loop wires them (file/image intake, the scaffold plan, drop + upload states). Presentation only.
  function dwightChatFile(who, name, sizeText, tag){
    var h='<div class="filecard"><svg class="ic" aria-hidden="true"><use href="#ic-file"/></svg>'+
      '<div><div class="fn">'+esc(name)+'</div><div class="fm">'+esc(sizeText||'')+'</div></div>'+(tag?'<span class="ftag">'+esc(tag)+'</span>':'')+'</div>';
    dwightChatAppend(who, h); }
  function dwightChatPlan(json){ var d; try{ d=JSON.parse(json); }catch(e){ d={groups:[]}; }
    var h='<div class="plan">';
    (d.groups||[]).forEach(function(g){ h+='<div class="pc"><span class="pk">'+esc(g.key)+'</span><span class="pn">'+esc(g.name)+'</span>'+
      '<button class="pb" onclick="_dwBuildStub(\''+esc(g.key)+'\')">Build '+esc(g.key)+'</button></div>'; });
    h+='</div>'; dwightChatAppend('dw', (d.lead?esc(d.lead):'')+h); }
  function dwightChatDrop(on){ var el=document.getElementById('drop'); if(el)el.classList.toggle('on', !!on); }
  function dwightChatUpload(pct){ var el=document.querySelector('#upbar i'); if(el)el.style.width=(pct==null?0:Math.max(0,Math.min(100,pct)))+'%'; }
  function _dwBuildStub(key){ /* SEAM (Phase 8): group-addressed building rides the mutation gate; inert in the shell */ }
  function _dwImgModal(src){ try{ var m=document.getElementById('imgmodal'); document.getElementById('imgmodal-img').src=src; m.classList.add('on'); }catch(e){} }
  // Brief BI: in a chat the footer is gone, and a status is the turn's live step, shown on the composer's line in place of the cost until the turn ends.
  // Everywhere else it is the verb's footer, as it always was.
  function dwightSetStatus(text,isError){
    var d=document.querySelector('.doc'); if(d&&d.classList.contains('chatmode')){ _live=text||''; _hdrCost(); return; }
    var s=document.getElementById('status'); if(!text){s.innerHTML='';return;}
    s.innerHTML='<span class="statusdot'+(isError?' err':'')+'"></span>'+esc(text); }
  function dwightSetTheme(t){ document.body.classList.toggle('dark',t==='dark'); }
</script>
</body>
